<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>承建方视角 · AI项目落地执行作战大屏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 1920px;
            height: 1080px;
            background: #081028;
            color: #ffffff;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            height: 90px;
            background: linear-gradient(90deg, #004499, #0088ff);
            border-radius: 8px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left h2 {
            font-size: 32px;
            margin-bottom: 5px;
        }
        .header-left span {
            font-size: 16px;
            color: #cce7ff;
        }
        .header-right {
            font-size: 18px;
            display: flex;
            gap: 30px;
        }
        .row {
            display: flex;
            gap: 15px;
            flex: 1;
        }
        .card {
            background: rgba(20, 40, 80, 0.9);
            border: 2px solid #0088ff;
            border-radius: 8px;
            padding: 20px;
            height: 100%;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: #66ccff;
            margin-bottom: 20px;
            border-left: 5px solid #66ccff;
            padding-left: 10px;
        }
        .num {
            font-size: 42px;
            font-weight: bold;
            color: #00ffcc;
            margin: 15px 0;
        }
        .warn-text {
            color: #ff6a00;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }
        .text {
            font-size: 18px;
            line-height: 1.8;
        }
        .w40 { width: 40%; }
        .w60 { width: 60%; }
        .w100 { width: 100%; }
        .chart {
            width: 100%;
            height: 280px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #66ccff;
            font-size: 18px;
        }
        .table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 16px;
        }
        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #0088ff;
        }
        .footer {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .btn {
            background: #0088ff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-success {
            background: #00b42a;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部 -->
        <div class="header">
            <div class="header-left">
                <h2>AI项目落地执行作战大屏</h2>
                <span>甲方单位：XX政府部门 | 实施阶段：集成调试</span>
            </div>
            <div class="header-right">
                <span>剩余工期：185天</span>
                <span>内部考核：90分 ★★★★☆</span>
            </div>
        </div>

        <!-- 第一行 -->
        <div class="row">
            <div class="w40">
                <div class="card">
                    <div class="card-title">AI智能排程与进度调度</div>
                    <div class="num">施工完成率：82%</div>
                    <p class="text">软件研发：80% | 硬件实施：90%</p>
                    <p class="warn-text">AI建议：调试与运维并行，缩短工期2天</p>
                </div>
            </div>
            <div class="w60">
                <div class="card">
                    <div class="card-title">分项业务实施管控</div>
                    <div class="chart">研发/实施/联调进度柱状图</div>
                </div>
            </div>
        </div>

        <!-- 第二行 -->
        <div class="row">
            <div class="w40">
                <div class="card">
                    <div class="card-title">内部成本与物资管控</div>
                    <div class="num">实际投入：3200万 | 物料库存：充足</div>
                    <p class="warn-text">AI缺料预警：无物料短缺</p>
                    <div class="chart">成本构成饼图</div>
                </div>
            </div>
            <div class="w60">
                <div class="card">
                    <div class="card-title">人员班组与任务看板</div>
                    <div class="num">人力缺口：研发工程师 2人</div>
                    <table class="table">
                        <tr>
                            <th>人员</th>
                            <th>岗位</th>
                            <th>任务完成率</th>
                        </tr>
                        <tr>
                            <td>张三</td>
                            <td>项目经理</td>
                            <td>100%</td>
                        </tr>
                        <tr>
                            <td>李四</td>
                            <td>研发</td>
                            <td>85%</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="card footer">
            <p class="text">现场问题：技术难点2个 | 需求疑问1个</p>
            <p class="text">验收资料完成率：75%</p>
            <button class="btn">生成施工日报</button>
            <button class="btn btn-success">AI整理验收资料</button>
        </div>
    </div>
</body>
</html>
